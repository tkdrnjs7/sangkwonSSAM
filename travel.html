<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>여행 가방을 부탁해!</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#f4f8fb;color:#243746}button,textarea{font:inherit}.wrap{max-width:1180px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#2f6f82,#4f8d99);color:#fff;border-radius:24px;padding:24px}.hero h1{margin:0 0 8px}.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;margin-top:18px}.card{background:#fff;border:1px solid #dce5ec;border-radius:20px;padding:18px}.trips,.tabs,.actions,.chips{display:flex;gap:8px;flex-wrap:wrap}.trip,.tab,.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:800}.trip{background:#edf3f6;color:#385261}.trip.active,.tab.active,.btn.primary{background:#2f6f82;color:#fff}.tab{background:#edf3f6;color:#506773}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.item{border:1px solid #dce5ec;border-radius:16px;padding:12px;position:relative;min-height:126px}.item.req{background:#fff8ea}.item .e{font-size:30px}.item b{display:block;margin-top:4px}.meta{font-size:11px;color:#71808b}.add{position:absolute;right:9px;bottom:9px;width:34px;height:34px;border:0;border-radius:10px;background:#2f6f82;color:#fff;font-size:20px}.add.remove{background:#b85b5b}.case{margin-top:14px;padding:13px;border:1px dashed #b6cbd4;border-radius:14px;background:#f8fbfc}.case button{margin-top:7px;border:0;border-radius:10px;padding:8px 10px;background:#e8f0f3;color:#385261;font-weight:800}.suitcase{background:linear-gradient(180deg,#8fc3cd,#6ca2ae);border:6px solid #497887;border-radius:28px;padding:14px 14px 16px;box-shadow:0 8px 18px rgba(0,0,0,.08);position:sticky;top:16px;max-width:430px;margin:0 auto}.handle{width:140px;height:25px;border:7px solid #4c7c89;border-bottom:0;border-radius:18px 18px 0 0;margin:-42px auto 12px}.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.slot{height:58px;background:#eef3f7;border:2px dashed #bdd0d8;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:800;padding:3px}.slot.full{border-style:solid;background:#fff}.slot .e{font-size:22px;display:block}.progress{height:10px;background:#e8eef2;border-radius:99px;overflow:hidden;margin:10px 0}.bar{height:100%;background:#2f6f82;width:0}.status{margin-top:10px;padding:10px;border-radius:12px;font-size:12px;font-weight:700}.ok{background:#ecf8f1;color:#34714d}.bad{background:#fff1f1;color:#a14d4d}textarea{width:100%;min-height:120px;border:1px solid #dce5ec;border-radius:14px;padding:12px;margin-top:8px}.btn.secondary{background:#e9f0f3;color:#45606c}.footer{text-align:center;color:#7b8b95;padding:24px 0}.modal{position:fixed;inset:0;background:#15252fbd;display:grid;place-items:center;padding:16px}.modal.hidden{display:none}.modalbox{background:#fff;border-radius:20px;padding:20px;max-width:720px;width:100%;max-height:90vh;overflow:auto}.result{border:1px solid #dce5ec;border-radius:16px;padding:16px;background:#f9fcfd}.result h2{margin-top:0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#eef4f6;border-radius:12px;padding:11px}.reason{margin-top:12px;background:#fff7e9;border-radius:12px;padding:12px;white-space:pre-wrap}
.outcome{margin-top:14px;border-radius:16px;padding:16px;font-weight:800;line-height:1.55}
.outcome.success{background:#eaf8ef;border:2px solid #9ed5b1;color:#2f6f49}
.outcome.hard{background:#fff1e8;border:2px solid #efbd9a;color:#8d542d}
.outcome .big{display:block;font-size:24px;margin-bottom:5px}.chip{background:#eef3f5;border-radius:99px;padding:6px 9px;font-size:11px}@media(max-width:900px){.grid{grid-template-columns:1fr}.items{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:12px}.items{grid-template-columns:1fr 1fr}.slot{height:58px}}

.result-bag{background:linear-gradient(180deg,#8fc3cd,#6ca2ae);border:6px solid #497887;border-radius:22px;padding:14px}
.result-bag-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.result-bag-slot{min-height:58px;background:#eef3f7;border:2px dashed #bdd0d8;border-radius:11px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:900;padding:3px}
.result-bag-slot.full{background:#fff;border-style:solid;border-color:#d5e1e7}
.result-bag-slot .e{display:block;font-size:20px}
</style></head><body>

  const success=caseNow.need

    :caseNow.any.some(id=>packed.includes(id));
  playResultSound(success);
const resultCells=[];
  packed.forEach(id=>{
    const it=I(id);
    for(let n=0;n<it.s;n++){
      resultCells.push(`<div class='result-bag-slot full'><div><span class='e'>${it.e}</span>${it.n}</div></div>`);
    }
  });
  while(resultCells.length<20)resultCells.push("<div class='result-bag-slot'></div>");

  $('result').innerHTML=`
    <h2>🧳 나의 여행 가방 완성!</h2>
    <div>${T().i} <b>${T().n}</b> · ${T().d}</div>
    <div class='stats' style='margin-top:12px'>
      <div class='stat'><b>${used()}/20칸</b><div>사용한 공간</div></div>
      <div class='stat'><b>${packed.length}개</b><div>챙긴 물건</div></div>
    </div>

    <div class='result-bag' style='margin-top:14px'>
      <div class='result-bag-grid'>${resultCells.join('')}</div>
    </div>

    <div class='chips' style='margin-top:12px'>
      ${packed.map(id=>`<span class='chip'>${I(id).e} ${I(id).n}</span>`).join('')}
    </div>

    <div class='reason'>💬 나의 선택 이유
${reason}</div>

    <div class='outcome ${success?'success':'hard'}'>
      <span class='big'>🎲 여행 중 돌발 상황!</span>
      ${caseNow.text}<br><br>
      <b>필요한 물건: ${caseNow.needLabel}</b><br>
      ${success?'✅ '+caseNow.ok:'😥 '+caseNow.bad}
    </div>`;

  $('modal').classList.remove('hidden');
};
$('close').onclick=()=>$('modal').classList.add('hidden');$('save').onclick=()=>{
  const c=document.createElement('canvas'),x=c.getContext('2d');
  c.width=1200;c.height=1100;
  x.fillStyle='#f3f8fa';x.fillRect(0,0,c.width,c.height);

  x.fillStyle='#2f6f82';x.fillRect(0,0,c.width,140);
  x.fillStyle='#fff';x.font='bold 44px sans-serif';x.fillText('여행 가방을 부탁해!',55,72);
  x.font='23px sans-serif';x.fillText(`${T().n}`,55,112);

  const bagX=55,bagY=185,bagW=1090,bagH=500;
  x.fillStyle='#497887';roundRect(x,bagX,bagY,bagW,bagH,28,true,false);
  x.fillStyle='#7fb2bd';roundRect(x,bagX+9,bagY+9,bagW-18,bagH-18,22,true,false);

  const gap=10,cols=5;
  const slotW=(bagW-58-gap*(cols-1))/cols;
  const slotH=92;
  let cells=[];
  packed.forEach(id=>{
    const it=I(id);
    for(let n=0;n<it.s;n++)cells.push(it);
  });
  while(cells.length<20)cells.push(null);

  cells.forEach((it,idx)=>{
    const col=idx%5,row=Math.floor(idx/5);
    const sx=bagX+29+col*(slotW+gap);
    const sy=bagY+28+row*(slotH+gap);
    x.fillStyle=it?'#ffffff':'#eef3f7';
    roundRect(x,sx,sy,slotW,slotH,12,true,false);
    x.strokeStyle=it?'#d5e1e7':'#bdd0d8';x.lineWidth=2;
    x.strokeRect(sx+1,sy+1,slotW-2,slotH-2);
    if(it){
      x.fillStyle='#263746';x.textAlign='center';
      x.font='28px sans-serif';x.fillText(it.e,sx+slotW/2,sy+36);
      x.font='bold 14px sans-serif';x.fillText(it.n,sx+slotW/2,sy+64);
      x.textAlign='left';
    }
  });

  x.fillStyle='#263746';x.font='bold 26px sans-serif';
  x.fillText(`사용한 공간: ${used()} / 20칸`,55,735);
  x.fillText(`챙긴 물건: ${packed.length}개`,430,735);

  x.font='bold 25px sans-serif';x.fillText('내가 이렇게 짐을 고른 이유',55,795);
  x.font='20px sans-serif';
  const reason=$('reason').value.trim();
  const lines=wrapText(x,reason,1040);
  lines.slice(0,8).forEach((ln,i)=>x.fillText(ln,55,835+i*31));

  if(caseNow){
    const success=caseNow.need?caseNow.need.every(id=>packed.includes(id)):caseNow.any.some(id=>packed.includes(id));
    const y=835+Math.min(lines.length,8)*31+32;
    x.fillStyle=success?'#eaf8ef':'#fff1e8';roundRect(x,55,y,1090,130,16,true,false);
    x.fillStyle=success?'#2f6f49':'#8d542d';
    x.font='bold 25px sans-serif';
    x.fillText(success?'여행 성공!':'조금 불편한 여행',75,y+38);
    x.font='18px sans-serif';
    x.fillText(caseNow.text.replace(/^[^ ]+\s*/,''),75,y+72);
    const detail=success?caseNow.ok:caseNow.bad;
    wrapText(x,detail,1010).slice(0,2).forEach((ln,i)=>x.fillText(ln,75,y+101+i*24));
  }

  x.fillStyle='#7b8c96';x.font='17px sans-serif';x.fillText('상권쌤 X 두클래스',55,1070);
  const a=document.createElement('a');
  a.download='나의_여행가방_결과.png';
  a.href=c.toDataURL('image/png');
  a.click();
};

render();

function roundRect(ctx,x,y,w,h,r,fill,stroke){
  if(w<2*r)r=w/2;if(h<2*r)r=h/2;
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  if(fill)ctx.fill();if(stroke)ctx.stroke();
}
function wrapText(ctx,text,maxWidth){
  const chars=[...text],lines=[];let line='';
  chars.forEach(ch=>{
    const test=line+ch;
    if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch}else line=test;
  });
  if(line)lines.push(line);
  return lines;
}
</script></body></html>
