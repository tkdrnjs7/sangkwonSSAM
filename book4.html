<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고유어 탐험 사전</title>
<style>
:root{
  --green:#4b9f78;
  --green-deep:#2f7757;
  --cream:#fffaf1;
  --paper:#ffffff;
  --ink:#39413f;
  --muted:#858d89;
  --line:#ebe9e3;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:system-ui,"Noto Sans KR",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 0%,#fff6dc 0 160px,transparent 161px),
    linear-gradient(180deg,#fffef9 0,#fbfcfa 100%);
}
button,input,select{font:inherit}
button{cursor:pointer}

/* ===== 상단 일러스트 헤더 ===== */
.hero{
  background:linear-gradient(180deg,#fff9e8 0%,#fffdf5 100%);
  border-bottom:1px solid #eee7d8;
}
.heroInner{
  max-width:1240px;
  margin:auto;
  padding:18px 20px 14px;
  display:grid;
  grid-template-columns:260px 1fr 380px;
  gap:24px;
  align-items:center;
}
.heroMascot{
  height:105px;
  position:relative;
  display:flex;
  align-items:flex-end;
}
.mascotScene{
  width:210px;
  height:105px;
}
.brand small{
  display:block;
  color:#6f9c75;
  font-weight:1000;
  font-size:13px;
  letter-spacing:.3px;
}
.brand h1{
  margin:4px 0 0;
  font-size:31px;
  letter-spacing:-1.1px;
  color:#33443c;
}
.brand p{
  margin:7px 0 0;
  color:#7e8883;
  font-size:13px;
}
.searchWrap{
  display:flex;
  gap:8px;
  align-items:center;
}
.searchWrap input{
  min-width:0;
  flex:1;
  border:2px solid #cfe3d4;
  background:#fff;
  border-radius:15px;
  padding:13px 15px;
  font-size:15px;
  outline:none;
}
.searchWrap input:focus{
  border-color:#65ac83;
  box-shadow:0 0 0 4px #65ac8317;
}
.searchBtn{
  border:0;
  border-radius:14px;
  padding:13px 17px;
  background:#4c9c73;
  color:#fff;
  font-weight:1000;
  box-shadow:0 5px 12px #4c9c7324;
}

/* ===== 일러스트 메뉴 ===== */
.menuSection{
  background:#fff;
  border-bottom:1px solid #efede7;
}
.menuInner{
  max-width:1240px;
  margin:auto;
  padding:13px 20px 16px;
}
.menuTitle{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:#818984;
  font-weight:900;
  margin-bottom:9px;
}
.categoryGrid{
  display:grid;
  grid-template-columns:repeat(11,minmax(0,1fr));
  gap:9px;
}
.cat{
  border:1px solid #eeeae2;
  border-radius:17px;
  min-height:98px;
  padding:7px 5px 8px;
  background:#fff;
  color:#59615d;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:11px;
  font-weight:1000;
  box-shadow:0 3px 10px #635a4909;
  transition:.16s;
}
.cat:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 15px #635a4914;
}
.cat.on{
  border:2px solid #4da176;
  box-shadow:0 0 0 3px #4da17612;
  background:#fbfffc;
}
.iconShell{
  width:58px;
  height:58px;
  border-radius:16px;
  display:grid;
  place-items:center;
  overflow:hidden;
}
.catLabel{line-height:1.1;text-align:center}
.cat[data-cat="all"] .iconShell{background:#fff1c9}
.cat[data-cat="nature"] .iconShell{background:#e5f6ff}
.cat[data-cat="plant"] .iconShell{background:#e8f7df}
.cat[data-cat="animal"] .iconShell{background:#fff0e0}
.cat[data-cat="body"] .iconShell{background:#ffe9ee}
.cat[data-cat="home"] .iconShell{background:#efeaff}
.cat[data-cat="food"] .iconShell{background:#fff5d8}
.cat[data-cat="action"] .iconShell{background:#e5f7f1}
.cat[data-cat="mind"] .iconShell{background:#ffe9f0}
.cat[data-cat="sound"] .iconShell{background:#fff0db}
.cat[data-cat="play"] .iconShell{background:#e9efff}

.page{
  max-width:1240px;
  margin:auto;
  padding:21px 20px 36px;
}
.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:15px;
  margin-bottom:15px;
}
.toolbar h2{
  margin:0;
  font-size:23px;
  letter-spacing:-.6px;
}
.toolbar h2 strong{color:#4b9f78}
.toolbar p{
  margin:5px 0 0;
  color:#8b928e;
  font-size:12px;
}
.controls{
  display:flex;
  gap:8px;
  align-items:center;
}
.count{
  border-radius:999px;
  background:#eaf6ef;
  color:#4d8063;
  font-size:11px;
  font-weight:1000;
  padding:7px 10px;
}
.controls select{
  border:1px solid #dddcd6;
  border-radius:10px;
  background:#fff;
  padding:8px 28px 8px 10px;
  color:#666e69;
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:14px;
}
.card{
  background:#fff;
  border:1px solid #ebe9e4;
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 5px 14px #4c463b0c;
  transition:.16s;
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:0 9px 20px #4c463b15;
}
.thumb{
  height:135px;
  background:#eef1ef;
  position:relative;
  overflow:hidden;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.thumbLoading{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  padding:15px;
  font-size:12px;
  color:#7b8580;
  background:linear-gradient(110deg,#edf0ee 8%,#fafbfa 18%,#edf0ee 33%);
  background-size:200% 100%;
  animation:shimmer 1.1s linear infinite;
}
@keyframes shimmer{to{background-position-x:-200%}}
.wordTag{
  position:absolute;
  left:9px;bottom:8px;
  background:#fffffff0;
  border-radius:8px;
  padding:4px 7px;
  font-size:11px;
  font-weight:1000;
  box-shadow:0 3px 8px #00000010;
}
.cardBody{padding:12px}
.wordRow{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}
.wordRow h3{
  margin:0;
  font-size:18px;
  letter-spacing:-.4px;
}
.badge{
  font-size:9px;
  border-radius:999px;
  padding:4px 6px;
  font-weight:1000;
  background:#e8f5ec;
  color:#418461;
}
.badge.alt{
  background:#eeeaff;
  color:#7563c8;
}
.meta{
  margin-top:4px;
  font-size:10px;
  font-weight:900;
  color:#9b8b95;
}
.meaning{
  margin-top:7px;
  min-height:54px;
  color:#66706a;
  font-size:12px;
  line-height:1.5;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.detailBtn{
  width:100%;
  border:0;
  border-radius:9px;
  padding:8px 9px;
  margin-top:9px;
  font-size:11px;
  font-weight:1000;
  background:#f2f4f2;
  color:#626a65;
}
.detailBtn:hover{background:#e8eee9}
.moreBtn{
  display:block;
  margin:20px auto 0;
  border:0;
  border-radius:12px;
  padding:10px 18px;
  background:#e9f6ef;
  color:#438060;
  font-weight:1000;
}
.empty{
  grid-column:1/-1;
  padding:50px;
  text-align:center;
  color:#929994;
}
.footer{
  text-align:center;
  padding:28px 0 5px;
  font-size:12px;
  color:#a0a5a1;
}

/* ===== 상세보기 ===== */
.modal{
  position:fixed;
  inset:0;
  background:#2d342f70;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:60;
}
.modal.on{display:flex}
.modalCard{
  width:min(880px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:21px;
  box-shadow:0 24px 54px #0000002b;
}
.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 17px;
  border-bottom:1px solid #eeeae4;
}
.closeBtn{
  border:0;
  border-radius:10px;
  padding:8px 11px;
  background:#f1f3ef;
  color:#616963;
  font-weight:1000;
}
.modalBody{
  display:grid;
  grid-template-columns:minmax(0,1fr) 300px;
}
.modalImage{
  min-height:340px;
  background:#edf0ed;
}
.modalImage img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.modalInfo{padding:18px}
.dictBox{
  margin-top:12px;
  border:1px solid #ece9e2;
  background:#fcfbf8;
  border-radius:12px;
  padding:12px;
}
.dictBox b{
  font-size:12px;
  color:#4c7d5e;
}
.source{
  margin-top:10px;
  color:#8c948f;
  font-size:11px;
  line-height:1.45;
}


/* ===== 크게 보기: 오른쪽 흰 정보영역 제거 ===== */
.singleModalCard{width:min(760px,100%);overflow:hidden}
.singleModalBody{position:relative;background:#e8eef0;min-height:520px;display:flex;flex-direction:column}
.singleModalBody>img{width:100%;height:330px;object-fit:cover;display:block;background:#edf0ed}
.modalOverlayInfo{flex:1;padding:18px 22px 22px;background:linear-gradient(135deg,#e6f3ed,#c9e4d6);color:#31433b}
.modalWordLine{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.modalWordLine h3{font-size:32px;margin:0;letter-spacing:-1px}
.modalMeta{margin-top:5px;font-size:12px;font-weight:900;color:#5f776c}
.modalMeaning{margin-top:12px;font-size:18px;line-height:1.65;font-weight:750}
.exampleBox{margin-top:15px;padding-top:14px;border-top:1px solid #ffffff88}
.exampleBox b{display:block;font-size:12px;color:#4c7d5e;margin-bottom:6px}
#modalExample{font-size:20px;line-height:1.55;font-weight:900;color:#29463a}
@media(max-width:680px){.singleModalBody>img{height:260px}.modalWordLine h3{font-size:28px}#modalExample{font-size:18px}}

/* responsive */
@media(max-width:1160px){
  .heroInner{grid-template-columns:210px 1fr 330px}
  .categoryGrid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:900px){
  .heroInner{grid-template-columns:1fr}
  .heroMascot{display:none}
  .categoryGrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:680px){
  .categoryGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toolbar{flex-direction:column;align-items:flex-start}
  .modalBody{grid-template-columns:1fr}
}
@media(max-width:460px){
  .categoryGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{grid-template-columns:1fr}
  .searchWrap{flex-wrap:wrap}
  .searchWrap input{flex-basis:100%}
  .heroInner,.menuInner,.page{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>

<section class="hero">
  <div class="heroInner">
    <div class="heroMascot">
      <svg class="mascotScene" viewBox="0 0 210 105" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <ellipse cx="108" cy="94" rx="78" ry="9" fill="#E9DFC8"/>
        <rect x="104" y="28" width="74" height="59" rx="8" fill="#86C49B"/>
        <rect x="113" y="38" width="56" height="39" rx="4" fill="#FFF8DC"/>
        <path d="M121 49h38M121 58h31M121 67h35" stroke="#D6B778" stroke-width="3" stroke-linecap="round"/>
        <circle cx="67" cy="42" r="21" fill="#FFD9B3"/>
        <path d="M45 40c2-17 15-27 29-23 9 2 16 9 17 20-7-5-12-7-18-6-7 1-13 5-17 12z" fill="#5B453C"/>
        <circle cx="61" cy="43" r="2" fill="#4A3C37"/><circle cx="74" cy="43" r="2" fill="#4A3C37"/>
        <path d="M63 52c5 4 9 4 14 0" fill="none" stroke="#B16B62" stroke-width="2" stroke-linecap="round"/>
        <rect x="48" y="62" width="40" height="30" rx="12" fill="#F6B35F"/>
        <path d="M48 72l-18 12M88 72l20 7" stroke="#FFD9B3" stroke-width="9" stroke-linecap="round"/>
        <rect x="20" y="80" width="35" height="12" rx="5" fill="#8EC7E8"/>
        <path d="M30 80V69M43 80V72" stroke="#567F98" stroke-width="3"/>
        <circle cx="184" cy="77" r="10" fill="#F0B95D"/>
        <path d="M181 66c-7-8-11-15-6-19 4-3 8 4 10 9 3-6 7-11 11-8 5 4-2 12-7 18" fill="#79B987"/>
      </svg>
    </div>
    <div class="brand">
      <small>🌱 우리말 보물창고</small>
      <h1>고유어 탐험 사전</h1>
      <p>궁금한 우리말을 찾아보고 사진과 뜻을 함께 살펴보세요.</p>
    </div>
    <div class="searchWrap">
      <input id="q" placeholder="예) 노을, 민들레, 빗자루">
      <button id="searchBtn" class="searchBtn">검색</button>
    </div>
  </div>
</section>

<section class="menuSection">
  <div class="menuInner">
    <div class="menuTitle">🧭 주제를 골라 탐험해 보세요</div>
    <div id="cats" class="categoryGrid"></div>
  </div>
</section>

<main class="page">
  <div class="toolbar">
    <div>
      <h2>총 <strong id="totalCount"></strong>개의 고유어가 있어요!</h2>
      <p>카드를 눌러 사진과 뜻을 자세히 살펴볼 수 있어요.</p>
    </div>
    <div class="controls">
      <span id="visibleCount" class="count"></span>
      <select id="sort">
        <option value="basic">기본순</option>
        <option value="word">가나다순</option>
        <option value="reverse">가나다 역순</option>
      </select>
    </div>
  </div>

  <section id="grid" class="grid"></section>
  <button id="moreBtn" class="moreBtn">더 보기</button>
  <div class="footer">상권쌤 X 두클래스</div>
</main>

<div id="modal" class="modal">
  <div class="modalCard singleModalCard">
    <div class="modalHead">
      <b id="modalTitle"></b>
      <button id="closeBtn" class="closeBtn">닫기</button>
    </div>
    <div class="singleModalBody">
      <img id="modalImg" alt="">
      <div class="modalOverlayInfo">
        <div class="modalWordLine"><h3 id="modalWord"></h3><span id="modalBadge" class="badge">고유어</span></div>
        <div id="modalMeta" class="modalMeta"></div>
        <div id="modalMeaning" class="modalMeaning"></div>
        <div class="exampleBox"><b>예시 문장</b><div id="modalExample"></div></div>
      </div>
    </div>
  </div>
</div>

<script>

function playUiSound(audio){
  try{
    audio.pause();
    audio.currentTime=0;
    const p=audio.play();
    if(p&&typeof p.catch==='function')p.catch(()=>{});
  }catch(e){}
}

let activeCat='all',limit=25,sortMode='basic';

$('totalCount').textContent=data.length;

const mediaCache=new Map();
const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      observer.unobserve(e.target);
      loadMedia(e.target);
    }
  });
},{rootMargin:'160px'});

function esc(s){
  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}
function catName(id){return (cats.find(c=>c.id===id)||{}).name||'전체'}
function shouldIllustrate(x){return illustrateCats.has(x.cat)||illustrateWords.has(x.word)}
function isTextThumb(x){return x.cat==='body'||x.cat==='play'}
function makeWordThumb(x){
  const [a,b,d]=colors(x.cat);
  const cat=catName(x.cat);
  return svgData(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">

    </defs>
    <rect width="640" height="430" rx="0" fill="url(#bg)"/>

function renderCats(){
  const allCard=`<button class="cat ${activeCat==='all'?'on':''}" data-cat="all"><span class="iconShell">${iconSvg('all')}</span><span class="catLabel">전체</span></button>`;
  $('cats').innerHTML=allCard+cats.map(c=>
    `<button class="cat ${activeCat===c.id?'on':''}" data-cat="${c.id}"><span class="iconShell">${iconSvg(c.id)}</span><span class="catLabel">${esc(c.name)}</span></button>`
  ).join('');
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{
    playUiSound(categoryClickSound);
    activeCat=b.dataset.cat;
    limit=25;
    renderCats();
    renderResults();
  });
}

function filtered(){
  const q=$('q').value.trim().toLowerCase();
  let list=data.filter(x=>
    (activeCat==='all'||x.cat===activeCat)&&
    (!q||(x.word+' '+x.meaning).toLowerCase().includes(q))
  );
  if(sortMode==='word')list=[...list].sort((a,b)=>a.word.localeCompare(b.word,'ko'));
  if(sortMode==='reverse')list=[...list].sort((a,b)=>b.word.localeCompare(a.word,'ko'));
  return list;
}

function cardHtml(x){
  return `<article class="card">
    <div class="thumb" data-media="${x.id}" data-word="${esc(x.word)}" data-cat="${x.cat}" data-meaning="${esc(x.meaning)}">
      <div class="thumbLoading">🖼️<br>자료를 불러오는 중이에요.</div>
      <div class="wordTag">${esc(x.word)}</div>
    </div>
    <div class="cardBody">
      <div class="wordRow"><h3>${esc(x.word)}</h3>${(isTextThumb(x)||shouldIllustrate(x))?'<span class="badge alt">낱말 카드</span>':'<span class="badge">고유어</span>'}</div>
      <div class="meta">${esc(catName(x.cat))}</div>
      <div class="meaning">${esc(x.meaning)}</div>
      <button class="detailBtn" data-open="${x.id}">크게 보기</button>
    </div>
  </article>`;
}

function renderResults(){
  const all=filtered(),list=all.slice(0,limit);
  $('visibleCount').textContent=all.length+'개';
  $('grid').innerHTML=list.length?list.map(cardHtml).join(''):'<div class="empty">찾는 고유어가 없습니다.</div>';
  $('moreBtn').style.display=all.length>limit?'block':'none';
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{playUiSound(detailClickSound);openDetail(+b.dataset.open)});
  document.querySelectorAll('[data-media]').forEach(el=>observer.observe(el));
}

async function fetchJson(url){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);
  try{
    const r=await fetch(url,{signal:c.signal});
    if(!r.ok)return null;
    return await r.json();
  }catch(e){return null}
  finally{clearTimeout(t)}
}
function pickThumb(obj){
  if(!obj||!obj.query||!obj.query.pages)return'';
  for(const p of Object.values(obj.query.pages)){
    if(p.thumbnail?.source)return p.thumbnail.source;
    if(p.imageinfo?.[0])return p.imageinfo[0].thumburl||p.imageinfo[0].url||'';
  }
  return'';
}
async function commons(q){
  return pickThumb(await fetchJson('https://commons.wikimedia.org/w/api.php?origin=*&action=query&format=json&generator=search&gsrnamespace=6&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=640'));
}
async function kowiki(q){
  return pickThumb(await fetchJson('https://ko.wikipedia.org/w/api.php?origin=*&action=query&format=json&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=640'));
}

async function tryQuery(q){
  const latin=/[A-Za-z]/.test(q);
  return latin ? ((await commons(q)) || (await kowiki(q))) : ((await kowiki(q)) || (await commons(q)));
}
function uniqueQueries(arr){return [...new Set(arr.filter(Boolean))];}
function buildQueryList(x){
  const key=x.cat+'|'+x.word;
  const exactKey=`${x.cat}|${x.word}|${x.meaning}`;
  const lists=[];
  const add=(...vals)=>vals.forEach(v=>{if(v)lists.push(v)});
  add(exactPhotoQueryMap[exactKey], betterWordQueryMap[key], photoQueryMap[key]);

  if(x.cat==='nature') add(`${x.word} nature landscape`, `${x.word} outdoor scene`);
  if(x.cat==='plant') add(`${x.word} plant close up`, `${x.word} botanical photo`);
  if(x.cat==='animal') add(`${x.word} animal photo`, `${x.word} wildlife close up`);
  if(x.cat==='body') add(`${x.word} human body close up`, `${x.word} human anatomy photo`);
  if(x.cat==='home') add(`${x.word} household object`, `${x.word} home 생활도구`);
  if(x.cat==='food') add(`${x.word} food photo`, `${x.word} dish close up`);
  if(x.cat==='play') add(`${x.word} traditional game photo`, `${x.word} children play`);

  // 짧고 뜻이 여러 개인 단어는 맨 마지막 bare query를 빼서 엉뚱한 사진을 줄입니다.
  const sensitiveCat = new Set(['body','home']);
  const ambiguousShort = x.word.length <= 2 || sensitiveCat.has(x.cat);
  if(!ambiguousShort) add(`${x.word}`);
  return uniqueQueries(lists);
}
async function resolveMedia(x){
  const cacheKey=x.cat+'|'+x.word+'|'+x.meaning;
  if(mediaCache.has(cacheKey))return mediaCache.get(cacheKey);
  if(shouldIllustrate(x)){
    const r={type:'illustration',src:makeIllustration(x)};
    mediaCache.set(cacheKey,r);
    return r;
  }
  const key=x.cat+'|'+x.word;
  const exactKey=`${x.cat}|${x.word}|${x.meaning}`;
  if(key==='animal|망아지'){
    const r={type:'photo',src:makeFoalIllustration()};
    mediaCache.set(cacheKey,r);
    return r;
  }
  const custom=makeFixedObjectIllustration(x);
  if(custom){
    const r={type:'photo',src:custom};
    mediaCache.set(cacheKey,r);
    return r;
  }
  const fixedSrc=fixedExactPhotoUrlMap[exactKey]||fixedPhotoUrlMap[key];
  if(fixedSrc){
    const r={type:'photo',src:fixedSrc};
    mediaCache.set(cacheKey,r);
    return r;
  }
  let src='';
  for(const q of buildQueryList(x)){
    src=await tryQuery(q);
    if(src) break;
  }
  const r=src?{type:'photo',src}:{type:'illustration',src:makeIllustration(x)};
  mediaCache.set(cacheKey,r);
  return r;
}
async function loadMedia(el){
  const x={word:el.dataset.word,cat:el.dataset.cat,meaning:el.dataset.meaning};
  if(isTextThumb(x)){
    const src=makeWordThumb(x);
    if(!el.isConnected)return;
    el.innerHTML=`<img alt="${esc(x.word)} 낱말 카드" loading="lazy" src="${src}">`;
    return;
  }
  const r=await resolveMedia(x);
  if(!el.isConnected)return;
  el.innerHTML=`<img alt="${esc(x.word)} 자료" loading="lazy" referrerpolicy="no-referrer" src="${r.src}" onerror="this.onerror=null;this.src='${makeIllustration(x)}'"><div class="wordTag">${esc(x.word)}</div>`;
}
async function openDetail(id){
  const x=data.find(v=>v.id===id);
  let r;
  if(isTextThumb(x)) r={type:'illustration',src:makeWordThumb(x)};
  else r=await resolveMedia(x);
  $('modalTitle').textContent=x.word+' 크게 보기';
  $('modalWord').textContent=x.word;
  $('modalMeta').textContent=catName(x.cat);
  $('modalMeaning').textContent=x.meaning;
  $('modalExample').textContent=exampleMap[String(x.id)]||'';
  $('modalImg').src=r.src;
  $('modalImg').alt=x.word+' 자료';
  $('modalBadge').className='badge'+((isTextThumb(x)||r.type==='illustration')?' alt':'');
  $('modalBadge').textContent=isTextThumb(x)?'낱말 카드':(r.type==='illustration'?'장면 삽화':'고유어');
  $('modal').classList.add('on');
}

$('searchBtn').onclick=()=>{limit=25;renderResults()};
$('q').addEventListener('input',()=>{limit=25;renderResults()});
$('sort').onchange=e=>{sortMode=e.target.value;limit=25;renderResults()};
$('moreBtn').onclick=()=>{limit+=25;renderResults()};
$('closeBtn').onclick=()=>$('modal').classList.remove('on');
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('on')});

renderCats();
renderResults();
</script>
