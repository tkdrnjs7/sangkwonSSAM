function audioReady(){if(!soundOn)return false;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return true}catch{return false}}
function tone(freq,duration,volume=.08,type='triangle',delay=0){if(!audioReady())return;const t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+duration+.03)}
function tickSound(n){tone(380+(n%3)*65,.056,.062,'square');tone(160+(n%2)*45,.045,.027,'triangle',.006)}
function ding(){tone(880,.64,.13,'sine');tone(1320,.8,.078,'sine',.085);tone(1760,.95,.046,'sine',.17);tone(660,.35,.05,'triangle',.02)}
function show(i){let t=types[i];word.textContent=t.name;symbol.textContent=t.emoji;slot.className='slot '+t.cls+(spinning?' spinning':'')}
function celebrate(){const symbols=['⭐','💖','✨','🎊','🌸'];for(let n=0;n<24;n++){let el=document.createElement('span');el.className='burst';el.textContent=symbols[n%symbols.length];el.style.left=(25+Math.random()*50)+'vw';el.style.top=(34+Math.random()*25)+'vh';el.style.setProperty('--dx',((Math.random()-.5)*630)+'px');el.style.setProperty('--dy',((Math.random()-.5)*450)+'px');document.body.appendChild(el);setTimeout(()=>el.remove(),1600)}}
function spin(){if(spinning)return;audioReady();spinning=true;btn.disabled=true;btn.textContent='💫 다다다다... 뽑는 중!';result.classList.add('off');$('tag').textContent='🎲 두근두근 뽑는 중';$('headline').textContent='운명이 빙글빙글 바뀌고 있어요!';$('challenge').textContent='';const chosen=Math.floor(Math.random()*3),mission=types[chosen].q[Math.floor(Math.random()*types[chosen].q.length)];let count=0,index=Math.floor(Math.random()*3),steps=27;function next(){index=(index+1)%3;show(index);tickSound(count);count++;if(count>=steps){spinning=false;show(chosen);ding();celebrate();result.classList.remove('off');$('tag').textContent=types[chosen].emoji+' '+types[chosen].name+' 바꾸기';$('headline').textContent='🎉 오늘의 운명은 '+types[chosen].name+'!';$('challenge').textContent=mission;btn.disabled=false;btn.textContent='🎀 한 번 더 뽑기!';return}let delay=count<13?65:count<19?95+(count-13)*16:190+(count-19)*36;setTimeout(next,delay)}next()}
btn.addEventListener('click',spin);$('reroll').addEventListener('click',spin);$('fullscreen').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()});$('sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 효과음 켜짐':'🔇 효과음 꺼짐';e.currentTarget.setAttribute('aria-pressed',String(soundOn));if(soundOn){audioReady();ding()}});document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['BUTTON','INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();spin()}});
</script></body></html>
